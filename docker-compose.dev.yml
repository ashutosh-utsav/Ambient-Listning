# Local development infrastructure only.
# Run: docker-compose -f docker-compose.dev.yml up -d
#
# Then start web-server and worker separately for hot reload:
#   uvicorn web_server.main:app --reload --port 8000
#   python -m worker.main
#
# Ports:
#   MinIO S3 API  → localhost:9000
#   MinIO console → localhost:9001  (minioadmin / minioadmin)
#   DynamoDB      → localhost:8001
#   Redis         → localhost:6379

services:

  minio:
    image: minio/minio:latest
    container_name: psychdesk-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # Creates the S3 bucket once on first run, then exits.
  # Subsystems write their own key prefixes (audio/, transcripts/) — no pre-creation needed.
  minio-init:
    image: minio/mc:latest
    container_name: psychdesk-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 2;
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb local/recordings --ignore-existing;
        echo 'Bucket ready.';
        exit 0;
      "
    restart: "no"

  # Creates the DynamoDB table once on first run, then exits.
  dynamodb-init:
    image: amazon/aws-cli:latest
    container_name: psychdesk-dynamodb-init
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c", "sleep 2 && aws dynamodb create-table --table-name sessionIndex --attribute-definitions AttributeName=session_id,AttributeType=S --key-schema AttributeName=session_id,KeyType=HASH --billing-mode PAY_PER_REQUEST --endpoint-url http://dynamodb-local:8000 --region us-east-1 2>&1 | grep -v ResourceInUseException || true && echo 'DynamoDB table ready.'"]
    restart: "no"

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: psychdesk-dynamodb
    ports:
      - "8001:8000"
    command: -jar DynamoDBLocal.jar -sharedDb -inMemory

  redis:
    image: redis:7-alpine
    container_name: psychdesk-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # Resource caps match ElastiCache cache.t4g.micro: 0.5 GB RAM, 2 vCPUs
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "2"

volumes:
  minio_data:
  redis_data:
